<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admissions Assistant</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>

  <body>
    <div class="chat-app">
      <!-- HEADER -->
      <header class="chat-header">
        <div class="title">🎓 Admissions Assistant</div>
        <div class="subtitle">Your virtual admissions guide</div>
      </header>

      <!-- CHAT AREA -->
      <main id="chat-box" class="chat-box">
        <div class="message bot">
          <div class="bubble">
            Hi 👋 I’m your University Admissions Assistant.<br />
            Ask me about programs, eligibility, fees, or duration.
          </div>
        </div>
      </main>

      <!-- INPUT -->
      <footer class="chat-input">
        <input
          id="user-input"
          type="text"
          placeholder="Type your message…"
          aria-label="Chat input"
        />
        <button onclick="sendMessage()" aria-label="Send">➤</button>
      </footer>

      <!-- COPYRIGHT -->
      <footer class="copyright">
        © <span id="year"></span> Rajarshi Ghosh. All rights reserved.
        <div class="social-links">
          <a href="https://github.com/itsrajarshi" target="_blank">GitHub</a>
          <span>•</span>
          <a href="https://linkedin.com/in/itsrajarshi" target="_blank"
            >LinkedIn</a
          >
        </div>
      </footer>
    </div>

    <!-- SCRIPT -->
    <script>
      const chatBox = document.getElementById("chat-box");
      const input = document.getElementById("user-input");

      document.getElementById("year").textContent = new Date().getFullYear();

      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          sendMessage();
        }
      });

      function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, "user");
        input.value = "";

        showTyping();

        fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        })
          .then((res) => res.json())
          .then((data) => {
            removeTyping();
            addMessage(data.reply, "bot");
          });
      }

      function addMessage(text, sender) {
        const msg = document.createElement("div");
        msg.className = `message ${sender}`;

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.innerHTML = text.replace(/\n/g, "<br>");

        msg.appendChild(bubble);
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function showTyping() {
        const typing = document.createElement("div");
        typing.className = "message bot typing";
        typing.innerHTML = `
        <div class="bubble typing-dots">
          <span></span><span></span><span></span>
        </div>`;
        chatBox.appendChild(typing);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function removeTyping() {
        const typing = document.querySelector(".typing");
        if (typing) typing.remove();
      }
    </script>
  </body>
</html>
